spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://interchange.proxy.rlwy.net:59347/railway
    username: postgres
    password: xNlDoAlaykurJXOCbcRrfzqmEvOuTwNL
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3   # reduzido para evitar crash no Railway
      minimum-idle: 1
      idle-timeout: 10000
      connection-timeout: 20000
      max-lifetime: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080   # Railway espera nessa porta

api:
  security:
    token:
      secret: ${JWT_SECRET:mysecret}   # se não setar no Railway, usa 'mysecret'
